[package]
name = "isudo"
description = "sudo with approval from your phone (the setuid-root binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Lets the binary run without being setuid root, reading its pairing file and
# helper path from the environment. For tests only: a binary built with this
# feature refuses to run as root, so it cannot be installed by mistake.
dev-unprivileged = []

[dependencies]
isudo-core = { workspace = true }
isudo-proto = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true

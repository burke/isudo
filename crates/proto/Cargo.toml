[package]
name = "isudo-proto"
description = "Wire formats shared by every isudo component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# HMAC-based pairing transcript helpers. Not needed by the setuid binary.
pairing = ["dep:hmac"]
# JSON types for the relay HTTP API. Not needed by the setuid binary.
api = ["dep:serde"]

[dependencies]
sha2 = { workspace = true }
hmac = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[lints]
workspace = true
